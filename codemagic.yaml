workflows:
  ios-app-store:
    name: iOS App Store build
    max_build_duration: 60
    instance_type: mac_mini
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.neigirao.lendasdoflu
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      node: '22'
      xcode: latest
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Build web app and sync Capacitor
        script: npm run mobile:sync
      - name: Fetch signing assets and set up code signing
        script: xcode-project use-profiles --project "$XCODE_PROJECT"
      - name: Build ipa for App Store distribution
        script: xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - neigirao@gmail.com
