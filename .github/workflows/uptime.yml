name: Disponibilidade dos apps

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verificar os cinco sites e abrir/fechar alertas
        uses: actions/github-script@v7
        with:
          script: |
            const sites = {
              'Pile of Books': 'https://pileofbooks.lovable.app/',
              'Lendas do Flu': 'https://lendasdoflu.com/',
              'Rep Up': 'https://repupgym.lovable.app/',
              'Vida do CLT': 'https://vidadoclt.lovable.app/',
              'GardenDex': 'https://gardendex.lovable.app/',
            };
            const { owner, repo } = context.repo;
            const { data: issues } = await github.rest.issues.listForRepo({ owner, repo, state: 'open', per_page: 100 });
            const failed = [];
            for (const [name, url] of Object.entries(sites)) {
              let result = 'sem resposta';
              let healthy = false;
              for (let attempt = 0; attempt < 3; attempt++) {
                try {
                  const response = await fetch(url, { redirect: 'follow', signal: AbortSignal.timeout(12000), headers: { 'User-Agent': 'Nei-App-Uptime-Check/1.0' } });
                  result = `HTTP ${response.status}`;
                  if (response.ok) { healthy = true; break; }
                } catch (error) {
                  result = error.message;
                }
                if (attempt < 2) await new Promise(resolve => setTimeout(resolve, 5000));
              }
              const title = `[Uptime] ${name} fora do ar`;
              const existing = issues.find(issue => !issue.pull_request && issue.title === title);
              if (!healthy) {
                failed.push(`${name}: ${result} (${url})`);
                if (!existing) {
                  await github.rest.issues.create({ owner, repo, title, body: `O site ${url} falhou em três tentativas (último resultado: ${result}). Confira o deploy e o provedor. Este alerta será fechado quando a página voltar a responder HTTP 2xx.\n\nVerificação: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}` });
                }
              } else if (existing) {
                await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body: `Recuperado: ${url} voltou a responder HTTP 2xx.` });
                await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'closed' });
              }
            }
            if (failed.length) core.setFailed(failed.join('\n'));
